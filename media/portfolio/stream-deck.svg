<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A macro keypad with fifteen glowing keys showing usage bars, a microphone, a monitor and a terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060e"/>
      <stop offset="1" stop-color="#140409"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#08080e"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151622"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </linearGradient>
    <g id="k">
      <rect width="170" height="170" rx="26" fill="url(#key)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- device body -->
  <rect x="290" y="130" width="1020" height="660" rx="56" fill="url(#body)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3"/>
  <rect x="330" y="170" width="940" height="580" rx="34" fill="#030308"/>

  <!-- keys: 5 cols x 3 rows; origin 360,215, step 182 -->
  <g transform="translate(360 195)">
    <!-- row 1 -->
    <use href="#k"/>
    <g transform="translate(0 0)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <text x="85" y="52" fill="#c9cad6" font-size="20" text-anchor="middle">5-HOUR</text>
      <rect x="25" y="78" width="120" height="18" rx="9" fill="#2a2b3a"/>
      <rect x="25" y="78" width="84" height="18" rx="9" fill="#ef4444"/>
      <text x="85" y="138" fill="#f5f5f7" font-size="30" font-weight="700" text-anchor="middle">70%</text>
    </g>
    <g transform="translate(182 0)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <use href="#k"/>
      <text x="85" y="52" fill="#c9cad6" font-size="20" text-anchor="middle">WEEKLY</text>
      <rect x="25" y="78" width="120" height="18" rx="9" fill="#2a2b3a"/>
      <rect x="25" y="78" width="38" height="18" rx="9" fill="#22c55e"/>
      <text x="85" y="138" fill="#f5f5f7" font-size="30" font-weight="700" text-anchor="middle">32%</text>
    </g>
    <g transform="translate(364 0)">
      <use href="#k"/>
      <!-- mic -->
      <rect x="66" y="36" width="38" height="66" rx="19" fill="none" stroke="#ef4444" stroke-width="7"/>
      <path d="M52 86 a33 33 0 0 0 66 0" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
      <line x1="85" y1="120" x2="85" y2="138" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g transform="translate(546 0)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <use href="#k"/>
      <rect x="0" y="0" width="170" height="170" rx="26" fill="#dc2626" fill-opacity="0.16"/>
      <text x="85" y="100" fill="#ef4444" font-size="46" font-weight="800" text-anchor="middle">48V</text>
    </g>
    <g transform="translate(728 0)">
      <use href="#k"/>
      <!-- headphones -->
      <path d="M42 112 v-20 a43 43 0 0 1 86 0 v20" fill="none" stroke="#c9cad6" stroke-width="7"/>
      <rect x="36" y="96" width="24" height="42" rx="8" fill="#c9cad6"/>
      <rect x="110" y="96" width="24" height="42" rx="8" fill="#c9cad6"/>
    </g>

    <!-- row 2 -->
    <g transform="translate(0 182)">
      <use href="#k"/>
      <!-- monitor -->
      <rect x="36" y="44" width="98" height="64" rx="8" fill="none" stroke="#c9cad6" stroke-width="7"/>
      <line x1="85" y1="108" x2="85" y2="128" stroke="#c9cad6" stroke-width="7"/>
      <line x1="60" y1="130" x2="110" y2="130" stroke="#c9cad6" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g transform="translate(182 182)">
      <use href="#k"/>
      <!-- tv -->
      <rect x="28" y="50" width="114" height="74" rx="10" fill="none" stroke="#c9cad6" stroke-width="7"/>
      <line x1="66" y1="26" x2="85" y2="48" stroke="#c9cad6" stroke-width="6" stroke-linecap="round"/>
      <line x1="104" y1="26" x2="85" y2="48" stroke="#c9cad6" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g transform="translate(364 182)" font-family="Consolas, Menlo, monospace">
      <use href="#k"/>
      <rect x="0" y="0" width="170" height="170" rx="26" fill="#dc2626" fill-opacity="0.12"/>
      <text x="85" y="102" fill="#ef4444" font-size="50" font-weight="700" text-anchor="middle">&gt;_</text>
    </g>
    <g transform="translate(546 182)">
      <use href="#k"/>
      <!-- note -->
      <path d="M50 34 h52 l22 22 v80 h-74 z" fill="none" stroke="#c9cad6" stroke-width="7" stroke-linejoin="round"/>
      <line x1="64" y1="82" x2="110" y2="82" stroke="#c9cad6" stroke-width="6" stroke-linecap="round"/>
      <line x1="64" y1="104" x2="100" y2="104" stroke="#c9cad6" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g transform="translate(728 182)">
      <use href="#k"/>
      <!-- calendar -->
      <rect x="38" y="46" width="94" height="86" rx="10" fill="none" stroke="#c9cad6" stroke-width="7"/>
      <line x1="38" y1="74" x2="132" y2="74" stroke="#c9cad6" stroke-width="7"/>
      <rect x="62" y="92" width="18" height="18" rx="3" fill="#ef4444"/>
    </g>

    <!-- row 3 -->
    <g transform="translate(0 364)"><use href="#k"/><circle cx="85" cy="85" r="10" fill="#2a2b3a"/></g>
    <g transform="translate(182 364)">
      <use href="#k"/>
      <!-- volume -->
      <path d="M40 70 h22 l30 -26 v82 l-30 -26 h-22 z" fill="#c9cad6"/>
      <path d="M108 60 a36 36 0 0 1 0 50" fill="none" stroke="#c9cad6" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g transform="translate(364 364)"><use href="#k"/><circle cx="85" cy="85" r="10" fill="#2a2b3a"/></g>
    <g transform="translate(546 364)">
      <use href="#k"/>
      <!-- play -->
      <polygon points="66,46 66,124 128,85" fill="#c9cad6"/>
    </g>
    <g transform="translate(728 364)"><use href="#k"/><circle cx="85" cy="85" r="10" fill="#2a2b3a"/></g>
  </g>

  <!-- stand -->
  <path d="M640 790 h320 l40 50 h-400 z" fill="#0c0c14" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
