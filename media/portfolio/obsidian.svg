<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A note editor with a daily brief code block next to a dark crystal and a graph of linked notes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060e"/>
      <stop offset="1" stop-color="#140409"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="facetA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a0d14"/>
      <stop offset="1" stop-color="#0b0306"/>
    </linearGradient>
    <linearGradient id="facetB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#5a0f17"/>
    </linearGradient>
    <linearGradient id="facetC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0609"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- graph view links -->
  <g stroke="#ef4444" stroke-opacity="0.35" stroke-width="2">
    <line x1="1060" y1="150" x2="1200" y2="230"/>
    <line x1="1200" y1="230" x2="1380" y2="170"/>
    <line x1="1200" y1="230" x2="1450" y2="380"/>
    <line x1="1450" y1="380" x2="1490" y2="600"/>
    <line x1="1490" y1="600" x2="1370" y2="760"/>
    <line x1="1370" y1="760" x2="1120" y2="790"/>
    <line x1="1060" y1="150" x2="960" y2="300"/>
    <line x1="1380" y1="170" x2="1450" y2="380"/>
  </g>
  <g fill="#ef4444">
    <circle cx="1060" cy="150" r="9"/>
    <circle cx="1200" cy="230" r="13"/>
    <circle cx="1380" cy="170" r="8"/>
    <circle cx="1450" cy="380" r="11"/>
    <circle cx="1490" cy="600" r="8"/>
    <circle cx="1370" cy="760" r="10"/>
    <circle cx="1120" cy="790" r="7"/>
    <circle cx="960" cy="300" r="7"/>
  </g>

  <!-- crystal -->
  <g transform="translate(1180 470)">
    <polygon points="0,-250 130,-60 80,230 -90,230 -150,-40" fill="url(#facetC)"/>
    <polygon points="0,-250 130,-60 20,10" fill="url(#facetB)"/>
    <polygon points="0,-250 20,10 -150,-40" fill="url(#facetA)"/>
    <polygon points="-150,-40 20,10 -90,230" fill="#12040a"/>
    <polygon points="20,10 130,-60 80,230" fill="#2a0810"/>
    <polygon points="20,10 80,230 -90,230" fill="#070205"/>
    <polygon points="0,-250 130,-60 80,230 -90,230 -150,-40" fill="none" stroke="#ef4444" stroke-opacity="0.6" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- note window -->
  <g transform="translate(120 130)">
    <rect width="760" height="640" rx="22" fill="#0b0c16" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
    <rect width="760" height="56" rx="22" fill="#11121f"/>
    <rect y="34" width="760" height="22" fill="#11121f"/>
    <circle cx="34" cy="28" r="8" fill="#dc2626"/>
    <circle cx="62" cy="28" r="8" fill="#3a3b4a"/>
    <circle cx="90" cy="28" r="8" fill="#3a3b4a"/>
    <text x="380" y="35" fill="#8b8ca0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle">Daily Notes / 2026-11-15.md</text>

    <text x="48" y="130" fill="#f5f5f7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700">Sunday</text>
    <rect x="48" y="160" width="420" height="12" rx="6" fill="#2a2b3a"/>
    <rect x="48" y="186" width="320" height="12" rx="6" fill="#2a2b3a"/>

    <rect x="48" y="230" width="664" height="200" rx="14" fill="#05060e" stroke="#dc2626" stroke-opacity="0.55" stroke-width="2"/>
    <text font-family="Consolas, Menlo, monospace" font-size="24">
      <tspan x="76" y="278" fill="#ef4444">```claude-daily-brief</tspan>
      <tspan x="76" y="318" fill="#c9cad6">Focus on work items.</tspan>
      <tspan x="76" y="358" fill="#c9cad6">Out of office after 3pm.</tspan>
      <tspan x="76" y="398" fill="#ef4444">```</tspan>
    </text>

    <rect x="48" y="462" width="300" height="56" rx="12" fill="#dc2626"/>
    <text x="198" y="498" fill="#fff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Generate daily brief</text>

    <g font-family="Consolas, Menlo, monospace" font-size="18" fill="#6f7088">
      <text x="48" y="560">› calendar.list_events … ok</text>
      <text x="48" y="588">› gmail.search_threads … ok</text>
      <text x="48" y="616" fill="#ef4444">› todoist.find_tasks …</text>
    </g>
  </g>
</svg>
