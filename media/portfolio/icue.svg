<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A wide touchscreen showing CPU, GPU and RAM load gauges with temperatures">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060e"/>
      <stop offset="1" stop-color="#140409"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- monitor bezel hint above -->
  <rect x="90" y="40" width="1420" height="250" rx="18" fill="#0a0a12" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <rect x="110" y="60" width="1380" height="210" rx="8" fill="#06070d"/>
  <g fill="#ffffff" fill-opacity="0.05">
    <rect x="150" y="100" width="420" height="22" rx="6"/>
    <rect x="150" y="140" width="320" height="22" rx="6"/>
    <rect x="1050" y="100" width="380" height="130" rx="10"/>
  </g>

  <!-- edge touchscreen -->
  <rect x="90" y="340" width="1420" height="500" rx="24" fill="#0b0c16" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
  <rect x="116" y="366" width="1368" height="448" rx="12" fill="#04050a"/>

  <text x="150" y="420" fill="#8b8ca0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" letter-spacing="4">SYSTEM STATS</text>
  <circle cx="1440" cy="412" r="8" fill="#22c55e"/>

  <!-- gauge template: r=120, circumference ~ 754, 270deg arc = 565 -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- CPU -->
    <g transform="translate(360 620)">
      <circle r="120" fill="none" stroke="#1d1e2b" stroke-width="22" stroke-dasharray="565 754" transform="rotate(135)" stroke-linecap="round"/>
      <circle r="120" fill="none" stroke="#ef4444" stroke-width="22" stroke-dasharray="243 754" transform="rotate(135)" stroke-linecap="round"/>
      <text y="14" fill="#f5f5f7" font-size="62" font-weight="700">43%</text>
      <text y="62" fill="#8b8ca0" font-size="26">58°C</text>
      <text y="150" fill="#c9cad6" font-size="28" font-weight="600" letter-spacing="3">CPU</text>
    </g>
    <!-- GPU -->
    <g transform="translate(800 620)">
      <circle r="120" fill="none" stroke="#1d1e2b" stroke-width="22" stroke-dasharray="565 754" transform="rotate(135)" stroke-linecap="round"/>
      <circle r="120" fill="none" stroke="#dc2626" stroke-width="22" stroke-dasharray="463 754" transform="rotate(135)" stroke-linecap="round"/>
      <text y="14" fill="#f5f5f7" font-size="62" font-weight="700">82%</text>
      <text y="62" fill="#8b8ca0" font-size="26">71°C</text>
      <text y="150" fill="#c9cad6" font-size="28" font-weight="600" letter-spacing="3">GPU</text>
    </g>
    <!-- RAM -->
    <g transform="translate(1240 620)">
      <circle r="120" fill="none" stroke="#1d1e2b" stroke-width="22" stroke-dasharray="565 754" transform="rotate(135)" stroke-linecap="round"/>
      <circle r="120" fill="none" stroke="#f87171" stroke-width="22" stroke-dasharray="345 754" transform="rotate(135)" stroke-linecap="round"/>
      <text y="14" fill="#f5f5f7" font-size="62" font-weight="700">61%</text>
      <text y="62" fill="#8b8ca0" font-size="26">44°C</text>
      <text y="150" fill="#c9cad6" font-size="28" font-weight="600" letter-spacing="3">RAM</text>
    </g>
  </g>
</svg>
