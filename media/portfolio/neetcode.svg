<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A code editor with a Python two-sum solution beside a binary tree diagram and a solved counter">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060e"/>
      <stop offset="1" stop-color="#140409"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- editor -->
  <g transform="translate(110 120)">
    <rect width="860" height="660" rx="22" fill="#0b0c16" fill-opacity="0.94" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
    <rect width="860" height="56" rx="22" fill="#11121f"/>
    <rect y="34" width="860" height="22" fill="#11121f"/>
    <circle cx="34" cy="28" r="8" fill="#dc2626"/>
    <circle cx="62" cy="28" r="8" fill="#3a3b4a"/>
    <circle cx="90" cy="28" r="8" fill="#3a3b4a"/>
    <rect x="130" y="12" width="190" height="44" rx="8" fill="#05060e"/>
    <text x="225" y="41" fill="#c9cad6" font-family="Consolas, Menlo, monospace" font-size="20" text-anchor="middle">two_sum.py</text>

    <g font-family="Consolas, Menlo, monospace" font-size="26">
      <g fill="#4b4c60" text-anchor="end">
        <text x="70" y="130">1</text><text x="70" y="176">2</text><text x="70" y="222">3</text>
        <text x="70" y="268">4</text><text x="70" y="314">5</text><text x="70" y="360">6</text>
        <text x="70" y="406">7</text><text x="70" y="452">8</text><text x="70" y="498">9</text>
      </g>
      <text x="100" y="130"><tspan fill="#ef4444">class</tspan><tspan fill="#f5f5f7"> Solution:</tspan></text>
      <text x="157" y="176"><tspan fill="#ef4444">def</tspan><tspan fill="#fca5a5"> twoSum</tspan><tspan fill="#f5f5f7">(self, nums, target):</tspan></text>
      <text x="214" y="222" fill="#f5f5f7">seen = {}</text>
      <text x="214" y="268"><tspan fill="#ef4444">for</tspan><tspan fill="#f5f5f7"> i, n </tspan><tspan fill="#ef4444">in</tspan><tspan fill="#f5f5f7"> enumerate(nums):</tspan></text>
      <text x="271" y="314" fill="#f5f5f7">diff = target - n</text>
      <text x="271" y="360"><tspan fill="#ef4444">if</tspan><tspan fill="#f5f5f7"> diff </tspan><tspan fill="#ef4444">in</tspan><tspan fill="#f5f5f7"> seen:</tspan></text>
      <text x="328" y="406"><tspan fill="#ef4444">return</tspan><tspan fill="#f5f5f7"> [seen[diff], i]</tspan></text>
      <text x="271" y="452" fill="#f5f5f7">seen[n] = i</text>
      <text x="100" y="498" fill="#6f7088"># O(n) time, O(n) space</text>
    </g>

    <rect x="40" y="560" width="780" height="64" rx="12" fill="#05060e" stroke="#22c55e" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="80" cy="592" r="14" fill="#22c55e"/>
    <path d="M73 592 l5 6 l10 -12" fill="none" stroke="#05060e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="601" fill="#c9cad6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">Accepted · all test cases passed</text>
  </g>

  <!-- binary tree -->
  <g stroke="#ef4444" stroke-opacity="0.55" stroke-width="4">
    <line x1="1270" y1="190" x2="1140" y2="320"/>
    <line x1="1270" y1="190" x2="1400" y2="320"/>
    <line x1="1140" y1="320" x2="1075" y2="450"/>
    <line x1="1140" y1="320" x2="1205" y2="450"/>
    <line x1="1400" y1="320" x2="1465" y2="450"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <circle cx="1270" cy="190" r="40" fill="#dc2626"/><text x="1270" y="201" fill="#fff">8</text>
    <circle cx="1140" cy="320" r="36" fill="#11121f" stroke="#ef4444" stroke-width="3"/><text x="1140" y="331" fill="#f5f5f7">3</text>
    <circle cx="1400" cy="320" r="36" fill="#11121f" stroke="#ef4444" stroke-width="3"/><text x="1400" y="331" fill="#f5f5f7">10</text>
    <circle cx="1075" cy="450" r="32" fill="#11121f" stroke="#ef4444" stroke-width="3"/><text x="1075" y="461" fill="#f5f5f7">1</text>
    <circle cx="1205" cy="450" r="32" fill="#11121f" stroke="#ef4444" stroke-width="3"/><text x="1205" y="461" fill="#f5f5f7">6</text>
    <circle cx="1465" cy="450" r="32" fill="#11121f" stroke="#ef4444" stroke-width="3"/><text x="1465" y="461" fill="#f5f5f7">14</text>
  </g>

  <!-- solved counter -->
  <g transform="translate(1060 560)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="440" height="220" rx="22" fill="#0b0c16" fill-opacity="0.9" stroke="#dc2626" stroke-opacity="0.5" stroke-width="2"/>
    <text x="40" y="70" fill="#8b8ca0" font-size="22" letter-spacing="4">SOLVED</text>
    <text x="40" y="160" fill="#f5f5f7" font-size="96" font-weight="800">118</text>
    <g transform="translate(270 70)">
      <rect y="0" width="18" height="110" rx="4" fill="#2a2b3a"/>
      <rect y="30" width="18" height="80" rx="4" fill="#22c55e"/>
      <rect x="40" y="0" width="18" height="110" rx="4" fill="#2a2b3a"/>
      <rect x="40" y="20" width="18" height="90" rx="4" fill="#f59e0b"/>
      <rect x="80" y="0" width="18" height="110" rx="4" fill="#2a2b3a"/>
      <rect x="80" y="70" width="18" height="40" rx="4" fill="#ef4444"/>
    </g>
  </g>
</svg>
